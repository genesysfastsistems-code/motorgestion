name: Mantener Supabase activo
# Supabase (plan gratis) pausa el proyecto tras ~7 días sin uso.
# Esta tarea consulta la base cada 2 días para que siga activa.
on:
  schedule:
    - cron: "17 12 */2 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de datos
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://xyrmjbfaakvfnriijiwx.supabase.co/rest/v1/registros?select=pk&limit=1" \
              -H "apikey: sb_publishable_jz-Je03pSDgc4dVtH81ZnQ_e8gMdFxL")
            echo "Respuesta: $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "Supabase no respondió: revisar si el proyecto está pausado"; exit 1
